name: Versión obligatoria

# Cada PR a main debe subir la versión (package.json) y documentarla en CHANGELOG.md.
# Marca este check como "required" en la protección de la rama main.
# Excepción: los PR de Dependabot (no puede editar versión/CHANGELOG). El job se omite y GitHub
# cuenta un check omitido como aprobado; sus cambios se anotan en la siguiente versión.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    # Autor del PR (no quien dispara el evento): un push de Dependabot sobre otro PR no omite el check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Comprobar versión y CHANGELOG
        run: |
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          node scripts/check-version.mjs "$BASE_VERSION"
