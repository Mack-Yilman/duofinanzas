name: CI

# Valida cada PR antes de fusionar: tipos, lint, tests unitarios, build estático (el mismo que
# publica Pages) y pruebas E2E con Playwright contra ese build (Supabase simulado, sin red).
# Recomendado: marcar el check "checks" como obligatorio en el ruleset de main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Caché de compilación de Next
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Build estático
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /duofinanzas
          NEXT_PUBLIC_SUPABASE_URL: https://vjglzizutcijcyexcume.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_-5jemi-CUKFZT1qHElyxSg_FAne0LLb
          NEXT_TELEMETRY_DISABLED: 1

      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (Playwright)
        run: npm run e2e -- --project=desktop --project=mobile
      - name: Informe E2E si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
