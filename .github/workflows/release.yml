name: Tag y Release

# Al fusionar en main crea el tag vX.Y.Z (según package.json) y un Release con su entrada del CHANGELOG.
# El tag lo crea la API de GitHub (gh release create --target): no requiere identidad de git en el runner.
# Manual: "Run workflow" con `ref` permite etiquetar un commit anterior (p. ej. una versión que no se publicó).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit o rama a etiquetar (por defecto main)"
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Crear tag y Release si no existen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          SHA=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "El tag $TAG ya existe; nada que hacer."
            exit 0
          fi
          # Notas: la sección "## [VERSION]" del CHANGELOG hasta la siguiente versión.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" --target "$SHA" --title "DúoFinanzas $TAG" --notes-file notes.md
          echo "✅ Creado $TAG en $SHA"
