# Actualizaciones automáticas: un PR mensual agrupado por ecosistema (pocas interrupciones).
# Cada PR de Dependabot debe subir versión + CHANGELOG antes de fusionar (check "Versión obligatoria").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
